    :root {

      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF7F5;
      color: #1F2937;
      overflow-x: hidden;
      width: 100%;
      padding-bottom: var(--sab);
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    .font-name-festive {
      font-family: 'Fredoka', cursive, sans-serif;
      font-weight: 700;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .shirt-drop-shadow { filter: drop-shadow(0 12px 20px rgba(31, 41, 55, 0.13)); }
    .modal-backdrop { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    .safe-pt { padding-top: max(0.75rem, var(--sat)); }
    .safe-pb { padding-bottom: max(1rem, var(--sab)); }
    .mobile-sheet-h { max-height: 92dvh; }
    .mobile-drawer-h { height: 100dvh; }
    @media screen and (max-width: 768px) {
      input[type="text"],
      input[type="search"],
      input[type="url"],
      select {
        font-size: 16px !important;
      }
    }
  </style>
</head>
